<!DOCTYPE html>
<html lang="es" data-theme="light" style="--acento:#005F73">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expectativas de Inflación · Populi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="comun/monitor.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="comun/monitor.js"></script>
</head>
<body>
  <div class="wrap">
    <div class="sec-hd">
      <h2 class="sec-title"><span class="accent-bar"></span>Expectativas de Inflación</h2>
      <p class="sec-sub" id="sub"></p>
    </div>

    <div class="hz-bar">
      <div class="hz-item"><span class="hz-lbl">Horizonte</span><div class="hz-grp" id="b-horizonte"></div></div>
    </div>

    <div class="kpi-grid" id="kpis"></div>

    <div class="main-grid">
      <div class="chart-card">
        <div class="chart-ctrl"><div class="tog-grp" id="pastillas"></div></div>
        <div class="grafico" id="chart"><div class="loading"><div class="spinner"></div><span>Cargando expectativas de inflación…</span></div></div>
      </div>
      <div class="panel">
        <div class="panel-hd"><span class="panel-hd-t">Lectura del indicador</span><span class="panel-hd-d" id="panel-fecha"></span></div>
        <div class="panel-body" id="panel"></div>
        <div class="panel-ft">
          <a href="../index.html" target="_blank" rel="noopener" class="amp">
            <span>Ver dashboard completo</span>
            <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
          </a>
        </div>
      </div>
    </div>

    <div class="edu-grid" id="preguntas"></div>
    <div class="source">
      <span class="source-txt" id="fuente"></span>
      <svg viewBox="0 0 310 130" xmlns="http://www.w3.org/2000/svg" style="height:16px;width:auto;opacity:.18;flex-shrink:0" aria-hidden="true">
        <text x="6" y="112" font-family="'Playfair Display',Georgia,serif" font-size="145" font-weight="700" fill="#C71E1D">P</text>
        <text x="92" y="87" font-family="'Playfair Display',Georgia,serif" font-size="55" font-weight="400" font-style="italic" letter-spacing="1" fill="currentColor">opuli</text>
      </svg>
    </div>
  </div>

  <script>
  (function () {
    var C = PM.C;
    // En tema oscuro la mediana (petróleo) sube a menta: el petróleo queda bajo 3:1 contra la tarjeta (validado).
    var SERIES = [
      { k: 'mediana', nombre: 'Mediana', color: { claro: C.petroleo, oscuro: C.menta }, ancho: 2.5, forma: 'linea' },
      { k: 'decil9', nombre: 'Decil 9 (pesimistas)', corto: 'Decil 9', color: C.rojo, ancho: 1.5, forma: 'punteada' },
      { k: 'decil1', nombre: 'Decil 1 (optimistas)', corto: 'Decil 1', color: C.turquesa, ancho: 1.5, forma: 'punteada' }
    ];
    var COL = { mediana: SERIES[0].color, decil9: SERIES[1].color, decil1: SERIES[2].color };
    var estado = { horizonte: 'siguiente', idx: null };
    var activas = new Set(['mediana', 'decil9', 'decil1']);
    var DATA, grafico;

    function serie() { return estado.horizonte === 'siguiente' ? DATA.series_siguiente : DATA.series_actual; }
    function tono(d) { return d > 0.05 ? 'malo' : d < -0.05 ? 'bueno' : 'neutro'; }   // en inflación esperada, subir es malo

    PM.cargar(['expectativas_inflacion.json']).then(function (r) {
      DATA = r[0];
      estado.idx = serie().length - 1;
      PM.botonera(document.getElementById('b-horizonte'), [['siguiente', 'Año siguiente'], ['actual', 'Año en curso']],
        estado.horizonte, function (v) { estado.horizonte = v; estado.idx = serie().length - 1; todo(); });
      PM.pastillas(document.getElementById('pastillas'),
        SERIES.map(function (s) { return { k: s.k, nombre: s.corto || s.nombre, color: s.color, forma: s.forma }; }),
        activas, function () { grafico.redibujar(); });
      var el = document.getElementById('chart');
      el.innerHTML = '';
      grafico = PM.montar(el, opciones);
      grafico.chart.on('click', function (p) { if (p.dataIndex != null) panel(p.dataIndex); });
      PM.alCambiarTema(function () { cifras(); panel(estado.idx); });
      todo(true);
      PM.preguntas(document.getElementById('preguntas'), PREGUNTAS);
      document.getElementById('fuente').innerHTML = 'Fuente: <a href="https://www.bcb.gob.bo/?q=resultados-encuestas" target="_blank" rel="noopener">BCB — Encuesta de Expectativas Económicas</a> · Elaboración: Centro de Estudios POPULI · Datos al: ' + PM.fecha(DATA.metadata.ultimo_dato);
    }).catch(function (e) { console.error(e); PM.error(document.getElementById('chart')); });

    function todo(inicial) {
      var s = serie();
      var hz = estado.horizonte === 'siguiente' ? 'dic. del año siguiente' : 'dic. del año en curso';
      document.getElementById('sub').textContent = 'Encuesta EEE — BCB · Inflación interanual esperada a ' + hz + ' · Serie ' +
        PM.fecha(s[0].survey_month) + ' – ' + PM.fecha(s[s.length - 1].survey_month);
      cifras();
      if (!inicial) grafico.redibujar();
      panel(estado.idx);
    }

    function cifras() {
      var s = serie(), u = s[s.length - 1], a = s[s.length - 2];
      var dMed = u.mediana - a.mediana, dD9 = u.decil9 - a.decil9, dD1 = u.decil1 - a.decil1;
      var rango = u.decil9 - u.decil1, dRango = rango - (a.decil9 - a.decil1);
      var delta = function (d) { return PM.flecha(d, 0.01) + ' ' + PM.num(Math.abs(d), 1) + ' pp'; };
      var serieK = function (f) { return PM.ultimos(s.map(f), 24); };
      document.getElementById('kpis').innerHTML =
        PM.kpi({ color: COL.mediana, rotulo: 'Mediana', valor: PM.pct(u.mediana, 1), delta: delta(dMed), tono: tono(dMed), serie: serieK(function (x) { return x.mediana; }) }) +
        PM.kpi({ color: COL.decil9, rotulo: 'Decil 9 (pesimistas)', valor: PM.pct(u.decil9, 1), delta: delta(dD9), tono: tono(dD9), serie: serieK(function (x) { return x.decil9; }) }) +
        PM.kpi({ color: COL.decil1, rotulo: 'Decil 1 (optimistas)', valor: PM.pct(u.decil1, 1), delta: delta(dD1), tono: tono(dD1), serie: serieK(function (x) { return x.decil1; }) }) +
        PM.kpi({ color: COL.mediana, rotulo: 'Rango (D9 – D1)', valor: PM.num(rango, 1) + ' pp', delta: delta(dRango), tono: tono(dRango), serie: serieK(function (x) { return x.decil9 - x.decil1; }) });
    }

    function opciones() {
      var s = serie(), K = s.map(function (x) { return x.survey_month; }), dk = PM.dk();
      var series = SERIES.filter(function (c) { return activas.has(c.k); }).map(function (c) {
        var data = s.map(function (x) { return x[c.k]; }), n = data.length - 1;
        var o = PM.linea(c.color, { ancho: c.ancho, punteada: c.forma === 'punteada', extra: {
          name: c.nombre, data: data, z: c.k === 'mediana' ? 3 : 2,
          markPoint: PM.puntoFinal(c.color, n, data[n])      // el último dato, con anillo del color de la tarjeta
        } });
        if (c.k === 'mediana') o.areaStyle = { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: PM.rgba(c.color, dk ? 0.16 : 0.10) }, { offset: 1, color: PM.rgba(c.color, 0) }]) };
        return o;
      });
      // Banda entre el decil 1 y el decil 9: la dispersión de las respuestas
      if (activas.has('decil1') && activas.has('decil9')) {
        series.push({
          type: 'custom', name: '_banda', silent: true, z: 0, data: s.map(function (_, i) { return [i, 0]; }),
          renderItem: function (params, api) {
            if (params.dataIndex !== 0) return;
            var pts = [], i;
            for (i = 0; i < s.length; i++) pts.push(api.coord([i, s[i].decil9]));
            for (i = s.length - 1; i >= 0; i--) pts.push(api.coord([i, s[i].decil1]));
            return { type: 'polygon', shape: { points: pts }, style: { fill: PM.rgba(C.petroleo, dk ? 0.10 : 0.07) } };
          }
        });
      }
      var el = document.getElementById('chart');
      return {
        animationDuration: 450,
        grid: PM.grid({ top: 16 }),
        xAxis: PM.ejeTiempo(K, el),
        yAxis: PM.ejeY({ fmt: 'pct', extra: { min: 0 } }),
        tooltip: PM.tooltip(function (ps) {
          var v = ps.filter(function (p) { return p.seriesName.charAt(0) !== '_'; });
          if (!v.length) return '';
          var i = v[0].dataIndex, x = s[i];
          panel(i);
          var h = PM.ttTitulo(PM.fecha(x.survey_month), 'Expectativa para ' + PM.fecha(x.target));
          v.forEach(function (p) {
            var c = SERIES.filter(function (q) { return q.nombre === p.seriesName; })[0];
            h += PM.ttFila(c.color, c.nombre, PM.pct(p.value, 1), c.forma);
          });
          return h;
        }),
        series: series
      };
    }

    function panel(i) {
      var s = serie();
      if (i == null || i < 0 || i >= s.length) return;
      estado.idx = i;
      var d = s[i], a = i > 0 ? s[i - 1] : null, dMed = a ? d.mediana - a.mediana : 0, rango = d.decil9 - d.decil1;
      var hz = estado.horizonte === 'siguiente' ? 'del año siguiente' : 'del año en curso';
      var med = PM.dt(COL.mediana, PM.pct(d.mediana, 1)), d9 = PM.dt(COL.decil9, PM.pct(d.decil9, 1)), d1 = PM.dt(COL.decil1, PM.pct(d.decil1, 1));
      var mes = PM.fecha(d.survey_month), meta = PM.fecha(d.target);
      var txt;
      if (d.mediana > 15) txt = 'Con una expectativa mediana de ' + med + ', los encuestados anticipan una <strong>inflación muy elevada</strong> al cierre ' + hz + '. El pesimismo se refleja en un decil 9 de ' + d9 + ', señal de una <strong>pérdida significativa de confianza</strong>.';
      else if (d.mediana > 10) txt = 'La expectativa mediana de ' + med + ' se sitúa en <strong>niveles altos</strong>. La dispersión de <strong>' + PM.num(rango, 1) + ' pp</strong> refleja una <strong>incertidumbre considerable</strong>.';
      else if (d.mediana > 5) txt = 'Con ' + med + ', los encuestados anticipan una inflación <strong>moderadamente elevada</strong>. El rango entre el decil 1 (' + d1 + ') y el decil 9 (' + d9 + ') sugiere visiones divergentes.';
      else txt = 'La expectativa mediana de ' + med + ' refleja <strong>confianza razonable</strong> en la estabilidad de precios, con un consenso relativamente estrecho: rango de <strong>' + PM.num(rango, 1) + ' pp</strong>.';
      document.getElementById('panel-fecha').textContent = mes;
      document.getElementById('panel').innerHTML =
        PM.pb(COL.mediana, 'Mediana', PM.pct(d.mediana, 1),
          'En <strong>' + mes + '</strong>, la expectativa mediana de inflación interanual para <strong>' + meta + '</strong> es ' + med +
          (a ? ', ' + (dMed >= 0 ? 'subiendo ' : 'bajando ') + PM.dt(COL.mediana, PM.num(Math.abs(dMed), 1) + ' pp') + ' respecto a ' + PM.fecha(a.survey_month) : '') +
          '. Basada en ' + d.respuestas + ' respuestas.') +
        PM.pb(COL.decil9, 'Decil 9 · Pesimistas', PM.pct(d.decil9, 1), 'El 10% más pesimista espera al menos ' + d9 + ' para ' + meta + '.') +
        PM.pb(COL.decil1, 'Decil 1 · Optimistas', PM.pct(d.decil1, 1), 'El 10% más optimista espera no más de ' + d1 + '.') +
        PM.ctx(txt);
    }

    var PREGUNTAS = [
      ['¿Qué son las expectativas de inflación?', 'Son las proyecciones que hacen los agentes económicos (empresas, analistas, académicos) sobre cuánto subirán los precios. El BCB las recopila mensualmente a través de la Encuesta de Expectativas Económicas (EEE), dirigida a ejecutivos, académicos e investigadores.'],
      ['¿Año siguiente vs. año en curso?', 'La serie <strong>«Año siguiente»</strong> muestra cuánta inflación esperan para diciembre del próximo año (horizonte largo). La serie <strong>«Año en curso»</strong> muestra la expectativa para diciembre de este mismo año (horizonte corto). Comparar ambas revela si el pesimismo es de corto o largo plazo.'],
      ['¿Qué significan mediana, D1 y D9?', 'La <strong>mediana</strong> es el valor central: la mitad espera más y la otra mitad menos. El <strong>decil 1</strong> marca el 10% más optimista y el <strong>decil 9</strong>, el 10% más pesimista. La diferencia entre ambos mide la <strong>incertidumbre</strong>.'],
      ['¿Por qué importan?', 'Las expectativas de inflación son un predictor clave de la inflación futura. Si los agentes esperan inflación alta, ajustan precios y salarios al alza, generando una <strong>profecía autocumplida</strong>. Expectativas desancladas dificultan enormemente el control de precios.']
    ];
  })();
  </script>
</body>
</html>
